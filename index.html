<!doctype html>
<html lang="id" class="notranslate" translate="no">
  <head>
    <meta charset="UTF-8" />
    <!-- Disable Browser Auto-Translate Prompt (Chrome, Edge, Safari) -->
    <meta name="google" content="notranslate" />
    <meta name="googlebot" content="notranslate" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon.png" />
    <link rel="icon" type="image/png" sizes="64x64" href="/favicon.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="shortcut icon" href="/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <!-- Cache-Control: Ensure browser always loads fresh HTML and latest script bundles -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <title>Classy — Ruang Informasi & Kolaborasi Kelas</title>
    <!-- DNS Prefetch & Preconnect for Fast Mobile / Cellular Connections -->
    <link rel="preconnect" href="https://identitytoolkit.googleapis.com" crossorigin />
    <link rel="dns-prefetch" href="https://identitytoolkit.googleapis.com" />
    <link rel="preconnect" href="https://firestore.googleapis.com" crossorigin />
    <link rel="dns-prefetch" href="https://firestore.googleapis.com" />

    <!-- Canonical Domain & Client-Side Redirect -->
    <link rel="canonical" href="https://classy.exars.my.id/" />
    <script>
      if (window.location.hostname === 'noted-by-blazed.vercel.app') {
        window.location.replace('https://classy.exars.my.id' + window.location.pathname + window.location.search + window.location.hash);
      }
    </script>

    <!-- Open Graph / WhatsApp / Social Preview -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://classy.exars.my.id/" />
    <meta property="og:title" content="Classy — Ruang Informasi & Kolaborasi Kelas" />
    <meta property="og:description" content="Platform manajemen jadwal, tugas terintegrasi Google Drive, materi perkuliahan, dan kolaborasi mahasiswa." />
    <meta property="og:image" content="https://classy.exars.my.id/logo.png" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:url" content="https://classy.exars.my.id/" />
    <meta name="twitter:title" content="Classy — Ruang Informasi & Kolaborasi Kelas" />
    <meta name="twitter:description" content="Platform manajemen jadwal, tugas terintegrasi Google Drive, materi perkuliahan, dan kolaborasi mahasiswa." />
    <meta name="twitter:image" content="https://classy.exars.my.id/logo.png" />

    <!-- Theme Colors -->
    <meta name="theme-color" content="#FDFBF7" />
    <meta name="color-scheme" content="light" />

    <!-- Apple iOS Safari Standalone Meta Tags -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Classy" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="apple-touch-icon" sizes="192x192" href="/icon-192.png" />
    <link rel="apple-touch-icon" sizes="512x512" href="/icon-512.png" />

    <!-- Microsoft / Windows Tile -->
    <meta name="msapplication-TileColor" content="#FDFBF7" />
    <script>
      // Automatically refresh if browser cached an old bundle that 404s after new deployment
      window.addEventListener('error', function(e) {
        var msg = (e && e.message) ? String(e.message).toLowerCase() : '';
        if (msg.includes('dynamically imported module') || msg.includes('loading chunk') || msg.includes('importing a module script failed')) {
          var key = 'classy_last_chunk_reload';
          var last = parseInt(sessionStorage.getItem(key) || '0', 10);
          if (Date.now() - last > 8000) {
            sessionStorage.setItem(key, String(Date.now()));
            window.location.reload();
          }
        }
      });
    </script>
  </head>
  <body class="notranslate" translate="no">
    <div id="root" class="notranslate" translate="no">
      <div style="min-height:100vh;width:100vw;display:flex;align-items:center;justify-content:center;background:#FDFBF7;font-family:system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;">
        <div style="display:flex;flex-direction:column;align-items:center;gap:12px;">
          <img src="/logo.png" alt="Classy" style="width:48px;height:48px;object-fit:contain;" onerror="this.style.display='none'" />
          <div style="width:22px;height:22px;border:2.5px solid #E2E8F0;border-top-color:#4F46E5;border-radius:50%;animation:classySpin 0.8s linear infinite;"></div>
          <span style="font-size:12px;color:#64748B;font-weight:500;">Memuat Classy...</span>
        </div>
      </div>
      <style>@keyframes classySpin{to{transform:rotate(360deg)}}</style>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
